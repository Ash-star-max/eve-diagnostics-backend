name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: eve_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eve" --health-interval 3s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL, incl. concurrency)
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://eve:eve@localhost:5432/eve_test
